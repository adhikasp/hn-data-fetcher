[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hn-data-fetcher"
version = "2.0.0"
authors = [
  { name="Adhika Setya Pramudita", email="adhika.setya.p@gmail.com" },
]
description = "Fast asynchronous Hacker News fetcher that writes Hive-partitioned Parquet files."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp>=3.9",
    "orjson>=3.9",
    "pyarrow>=14",
    "tqdm>=4.65",
    "boto3>=1.26",
    "python-dotenv>=1.0",
    "rich>=13",
]

[project.optional-dependencies]
fast = ["uvloop>=0.19; sys_platform != 'win32'"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.urls]
"Homepage" = "https://github.com/adhikasp/hn-data-fetcher"
"Bug Tracker" = "https://github.com/adhikasp/hn-data-fetcher/issues"

[project.scripts]
hn-data-fetcher = "hn_data_fetcher:main"
upload-to-tigris = "hn_data_fetcher:upload_to_tigris"
delete-from-tigris = "hn_data_fetcher:delete_from_tigris"

[tool.hatch.build.targets.wheel]
packages = ["src/hn_data_fetcher"]

[tool.pytest.ini_options]
addopts = "-ra -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # formatter owns line length
